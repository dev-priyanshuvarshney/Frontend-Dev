<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main>
    <section class="transform-container">
      <div class="transform-box rotate-box"></div>
      <div class="transform-box scale-box"></div>
      <div class="transform-box translate-box"></div>
      <div class="transform-box skew-box"></div>
    </section>

    <section class="labels">
      <p>Rotate()</p>
      <p>Scale()</p>
      <p>Translate()</p>
      <p>Skew()</p>
    </section>
  </main>

  <footer>
    <p>© 2025 CSS Transformations Demo</p>
  </footer>
</body>
</html>
