<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Advanced CSS Selectors Demonstration</h1>
  </header>

  <main>
    <section class="form-section">
      <h2>Attribute Selectors</h2>
      <form>
        <input type="text" placeholder="Enter your name">
        <input type="email" placeholder="Enter your email">
        <button type="submit">Submit</button>
      </form>
      <p>Visit <a href="https://example.com">our secure site</a> or <a href="http://example.org">this page</a>.</p>
    </section>

    <section class="list-section">
      <h2>List Demonstrating Pseudo-classes and Combinators</h2>
      <ul class="item-list">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
        <li>Fifth item</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 2025 Advanced CSS Selectors Demo</p>
  </footer>
</body>
</html>
