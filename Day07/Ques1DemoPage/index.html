<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Borders and Padding Demonstration</h1>
  </header>

  <main>
    <section class="box-container">
      <!-- Box 1 -->
      <div class="box solid-border">
        <h2>Solid Border</h2>
        <p>This box uses a solid border style.</p>
      </div>

      <!-- Box 2 -->
      <div class="box dashed-border">
        <h2>Dashed Border</h2>
        <p>This box uses a dashed border style.</p>
      </div>

      <!-- Box 3 -->
      <div class="box double-border">
        <h2>Double Border</h2>
        <p>This box uses a double border style.</p>
      </div>

      <!-- Box 4 -->
      <div class="box groove-border">
        <h2>Groove Border</h2>
        <p>This box uses a groove border style with rounded corners.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Borders and Padding Demo</p>
  </footer>
</body>
</html>
