<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="flipcard.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <!-- Front Side -->
        <div class="card-front">
          <img src="https://picsum.photos/id/1025/300/200" alt="Animal">
          <h2>Wild Horse</h2>
        </div>

        <!-- Back Side -->
        <div class="card-back">
          <p>The wild horse runs free across open plains, a symbol of strength and freedom.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
