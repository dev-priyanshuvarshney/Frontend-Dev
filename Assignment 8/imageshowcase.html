<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="imageshowcase.css">
</head>
<body>
  <header>
    <h1>Beautiful Image Showcase</h1>
  </header>

  <main>
    <section class="gallery">
      <figure class="image-card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/300/200?random=1" alt="Nature Scene">
          <div class="overlay"></div>
        </div>
        <figcaption>Peaceful Nature</figcaption>
      </figure>

      <figure class="image-card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/300/200?random=2" alt="Mountain View">
          <div class="overlay"></div>
        </div>
        <figcaption>Majestic Mountains</figcaption>
      </figure>

      <figure class="image-card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/300/200?random=3" alt="Ocean Wave">
          <div class="overlay"></div>
        </div>
        <figcaption>Ocean Waves</figcaption>
      </figure>

      <figure class="image-card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/300/200?random=4" alt="Forest Path">
          <div class="overlay"></div>
        </div>
        <figcaption>Forest Path</figcaption>
      </figure>

      <figure class="image-card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/300/200?random=5" alt="Desert Dunes">
          <div class="overlay"></div>
        </div>
        <figcaption>Golden Desert</figcaption>
      </figure>

      <figure class="image-card">
        <div class="img-wrapper">
          <img src="https://picsum.photos/300/200?random=6" alt="City Skyline">
          <div class="overlay"></div>
        </div>
        <figcaption>City Lights</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Created by [Your Name] | Image Showcase using CSS Grid</p>
  </footer>
</body>
</html>
