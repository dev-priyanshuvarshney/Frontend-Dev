<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="tooltip.css">
</head>
<body>
  <header>
    <h1>CSS Tooltip Demonstration</h1>
  </header>

  <main>
    <section class="container">
      <article class="tooltip-box">
        <span class="tooltip-item">💡</span>
        <span class="tooltip-text">This is a light bulb tooltip!</span>
      </article>

      <article class="tooltip-box">
        <span class="tooltip-item">📚</span>
        <span class="tooltip-text">Learning never stops!</span>
      </article>

      <article class="tooltip-box">
        <span class="tooltip-item">❤️</span>
        <span class="tooltip-text">Spread kindness and love!</span>
      </article>

      <article class="tooltip-box">
        <span class="tooltip-item word">Hover Me</span>
        <span class="tooltip-text">I’m a text tooltip built with pure CSS!</span>
      </article>
    </section>
  </main>

  <footer>
    <p>Created by [Your Name] | Tooltip Page using CSS</p>
  </footer>
</body>
</html>
