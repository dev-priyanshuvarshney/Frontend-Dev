<!DOCTYPE html>
<html>
<head>
    <title>Course Registration Form</title>
</head>
<body>
    <h1>Course Registration Form</h1>
    <form>
        <fieldset>
            <legend>Student Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Course Selection</legend>

            <label for="course">Select a Course:</label>
            <select id="course" name="course">
                <option value="">-- Choose a Course --</option>
                <option value="web">Web Development</option>
                <option value="java">Java Programming</option>
                <option value="python">Python Basics</option>
                <option value="data">Data Science</option>
                <option value="ai">Artificial Intelligence</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Available Course Schedules</legend>

            <table border="1" cellpadding="8" cellspacing="0">
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Instructor</th>
                </tr>
                <tr>
                    <td>Monday</td>
                    <td>10:00 AM - 12:00 PM</td>
                    <td>Mr. Sharma</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td>2:00 PM - 4:00 PM</td>
                    <td>Ms. Gupta</td>
                </tr>
                <tr>
                    <td>Friday</td>
                    <td>11:00 AM - 1:00 PM</td>
                    <td>Mr. Verma</td>
                </tr>
            </table>
        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </form>

    <footer>
        <p>&copy; 2025 Online Course Portal</p>
    </footer>
</body>
</html>
