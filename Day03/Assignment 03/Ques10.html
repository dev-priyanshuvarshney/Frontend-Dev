<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection Page</title>
</head>
<body>

<h1>Travel Selection Page</h1>

<form>
    <label for="country">Select Country:</label>
    <select id="country" name="country">
        <option selected>-- Select Country --</option>
        <option>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>
    <br><br>

    <label for="state">Select State:</label>
    <select id="state" name="state">
        <option selected>-- Select State --</option>
        <option>Uttar Pradesh</option>
        <option>Maharashtra</option>
        <option>Tokyo Prefecture</option>
        <option>Ile-de-France</option>
    </select>
    <br><br>

    <label for="city">Select City:</label>
    <select id="city" name="city">
        <option selected>-- Select City --</option>
        <option>Agra</option>
        <option>Mumbai</option>
        <option>Tokyo</option>
        <option>Paris</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option selected>-- Select Place --</option>
        <option>Taj Mahal</option>
        <option>Eiffel Tower</option>
        <option>Mount Fuji</option>
        <option>Great Barrier Reef</option>
    </select>
</form>

<br>

<p>Your selected travel choices will appear here after selection. Enjoy exploring your favorite destinations!</p>

</body>
</html>
